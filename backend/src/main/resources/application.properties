spring.application.name=smoothroute-backend
server.port=${PORT:8080}

# ---- Database ----
# Local development: a file database (H2), created in the ./data folder. No install needed.
# Online: set these three environment variables to a PostgreSQL database instead.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/smoothroute}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Which web addresses may call the API (CORS) ----
# Override online with the environment variable SMOOTHROUTE_CORS_ALLOWED_ORIGINS (comma separated).
smoothroute.cors.allowed-origins=http://localhost:*,https://smoothroute-chi.vercel.app,https://*.vercel.app

# ---- Clustering ----
# Reports closer than this (metres) are merged into one spot. GPS is only accurate to about 5-10 m.
smoothroute.cluster.radius-meters=15
# A spot is "confirmed" once it has at least this many reports.
smoothroute.cluster.confirm-reports=2

# ---- Severity limits (starting values: 1.5x and 2.5x the default detection thresholds) ----
# plain mode: jolt in m/s^2
smoothroute.severity.plain.moderate=4.5
smoothroute.severity.plain.severe=7.5
# normalised mode: jolt per m/s of speed
smoothroute.severity.normalised.moderate=0.75
smoothroute.severity.normalised.severe=1.25

# ---- Safety limits ----
smoothroute.max-batch-size=500
